<svg xmlns="http://www.w3.org/2000/svg" width="720" height="190" viewBox="0 0 720 190" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="720" height="190" fill="#ffffff"/>
  <!-- Hybrid PDF -->
  <rect x="20" y="20" width="200" height="120" fill="#ED7D31" stroke="#AE5A21" stroke-width="2"/>
  <text x="120" y="48" font-size="20" fill="#fff" text-anchor="middle">PDF</text>
  <rect x="45" y="65" width="150" height="55" fill="#4472C4" stroke="#2F528F" stroke-width="2"/>
  <text x="120" y="99" font-size="20" fill="#fff" text-anchor="middle">XML (CII)</text>
  <text x="120" y="168" font-size="16" fill="#000" text-anchor="middle">ZUGFeRD / Factur-X</text>
  <!-- Arrow -->
  <line x1="240" y1="80" x2="470" y2="80" stroke="#444" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="355" y="68" font-size="14" fill="#000" text-anchor="middle">zugferd-to-peppol-bis</text>
  <text x="355" y="104" font-size="12" fill="#444" text-anchor="middle">CII → UBL, PDF embedded</text>
  <!-- Peppol BIS -->
  <rect x="490" y="20" width="200" height="120" fill="#4472C4" stroke="#2F528F" stroke-width="2"/>
  <text x="590" y="48" font-size="20" fill="#fff" text-anchor="middle">XML (UBL)</text>
  <rect x="515" y="65" width="150" height="55" fill="#ED7D31" stroke="#AE5A21" stroke-width="2"/>
  <text x="590" y="99" font-size="20" fill="#fff" text-anchor="middle">PDF (base64)</text>
  <text x="590" y="168" font-size="16" fill="#000" text-anchor="middle">Peppol BIS Billing 3</text>
</svg>
